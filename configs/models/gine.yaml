data:
  manifest: data/raw/final-manifest.csv
  artifact_roots: [data/processed]
  catalog: data/processed/metadata/catalog.parquet
seeds: [13, 42, 2026]
common_gnn:
  device: cpu
  torch_num_threads: 12
  hidden_dim: 64
  layers: 2
  dropout: 0.2
  heads: 2
  train_eps: true
  add_self_loops: true
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 8
  gradient_clip: 2.0
  max_nodes_per_batch: 50000
  max_edges_per_batch: 200000
  num_workers: 0
